name: Lint

on:
  push:
    branches:
    tags:
  pull_request:

jobs:
  # Style checks run on a single pinned PHP on purpose: php-cs-fixer output
  # does not depend on the runtime version, so a matrix would only multiply
  # CI minutes (Guzzle and Symfony pin their static checks the same way).
  # Runtime compatibility with PHP 8.2-8.5 is covered by the tests workflow.
  php-cs-fixer:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        tools: composer
        coverage: none
    - name: Install dependencies
      run: composer install --prefer-dist --no-interaction --no-progress
    - name: Check code style
      run: vendor/bin/php-cs-fixer fix --dry-run --diff
