name: Tests

on:
  push:
    branches:
    tags:
  pull_request:

jobs:
  # HTTP transport: must work WITHOUT the grpc extension.
  # Runs Unit + Feature suites against a real reindexer server.
  http:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    services:
      reindexer:
        image: reindexer/reindexer:v5.15.0
        ports:
          - 9088:9088
    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        tools: composer
        coverage: xdebug
    - name: Show php and composer version
      run: php -v && composer -V
    - name: Assert grpc extension is NOT loaded
      run: |
        php -r 'exit(extension_loaded("grpc") ? 1 : 0);'
    - name: Install dependencies
      run: composer install --prefer-dist --no-interaction --no-progress
    - name: Run Unit suite
      run: vendor/bin/phpunit --testsuite Unit --coverage-clover=coverage.xml
      env:
        XDEBUG_MODE: coverage
    - name: Run Feature suite (HTTP integration)
      run: vendor/bin/phpunit --testsuite Feature
      env:
        REINDEXER_HOST: "http://127.0.0.1:9088"
    - name: Upload coverage to codecov
      uses: codecov/codecov-action@v4
      with:
        files: coverage.xml
        verbose: true

  # gRPC transport: same code with ext-grpc, runs the GrpcFeature suite
  # against the reindexer gRPC endpoint.
  grpc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    services:
      reindexer:
        image: reindexer/reindexer:v5.15.0
        ports:
          - 9088:9088
          - 16534:16534
    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: grpc
        tools: composer
        coverage: none
    - name: Assert grpc extension IS loaded
      run: |
        php -r 'exit(extension_loaded("grpc") ? 0 : 1);'
    - name: Install dependencies
      run: composer install --prefer-dist --no-interaction --no-progress
    - name: Run Unit suite (with ext-grpc present)
      run: vendor/bin/phpunit --testsuite Unit
    - name: Run GrpcFeature suite (gRPC integration)
      run: vendor/bin/phpunit --testsuite GrpcFeature
      env:
        REINDEXER_GRPC_TARGET: "127.0.0.1:16534"
